[package]
name = "qvm-ctl"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Simple, lightweight QEMU/KVM virtual machines from your terminal"
repository = "https://github.com/HenriqueStelzer/qvm-ctl"
readme = "README.md"

[[bin]]
name = "qvm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
nix = { version = "0.29", features = ["signal", "process"] }
fd-lock = "4"
supports-color = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
